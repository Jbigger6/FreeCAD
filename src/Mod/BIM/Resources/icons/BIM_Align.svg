<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   version="1.1"
   width="64px"
   height="64px"
   viewBox="0 0 64 64">
  <defs>
    <!-- Blue gradient for objects (matches BIM icon family) -->
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#204a87;stop-opacity:1"/>
    </linearGradient>
    <!-- Lighter blue for the target object (not yet aligned) -->
    <linearGradient id="blueGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:#9dbfdf;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#3a6aad;stop-opacity:1"/>
    </linearGradient>
    <!-- Orange/yellow gradient for reference edge highlight -->
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#fce94f;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#c4a000;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- ── Reference object (left): its right edge sits on the reference line ── -->
  <rect
     x="4" y="16" width="18" height="32"
     style="fill:url(#blueGrad);stroke:#0b1521;stroke-width:1.5;stroke-linejoin:round"/>
  <!-- Highlight the right edge of the reference object in orange -->
  <line x1="22" y1="16" x2="22" y2="48"
     style="stroke:url(#orangeGrad);stroke-width:2.5;stroke-linecap:round"/>

  <!-- ── Reference line: dashed vertical line extending beyond both objects ── -->
  <line x1="22" y1="4" x2="22" y2="14"
     style="stroke:#c4a000;stroke-width:1.5;stroke-dasharray:3,3;stroke-linecap:round"/>
  <line x1="22" y1="50" x2="22" y2="60"
     style="stroke:#c4a000;stroke-width:1.5;stroke-dasharray:3,3;stroke-linecap:round"/>

  <!-- ── Target object (right): left edge is offset — needs to move left ── -->
  <rect
     x="32" y="22" width="22" height="20"
     style="fill:url(#blueGradLight);stroke:#0b1521;stroke-width:1.5;stroke-linejoin:round"/>

  <!-- ── Arrow showing the target object moving left to the reference line ── -->
  <!-- Arrow shaft -->
  <line x1="32" y1="32" x2="26" y2="32"
     style="stroke:#c4a000;stroke-width:2.5;stroke-linecap:round"/>
  <!-- Arrowhead pointing left -->
  <polygon points="22,32 28,28.5 28,35.5"
     style="fill:#fce94f;stroke:#c4a000;stroke-width:1;stroke-linejoin:round"/>

</svg>
