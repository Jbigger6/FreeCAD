<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   width="64px"
   height="64px"
   viewBox="0 0 64 64">
  <defs>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" style="stop-color:#729fcf;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#204a87;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" style="stop-color:#9dbfdf;stop-opacity:1"/>
      <stop offset="1" style="stop-color:#3a6aad;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Walls -->
  <rect x="10" y="30" width="44" height="28"
     style="fill:url(#wallGrad);stroke:#0b1521;stroke-width:2;stroke-linejoin:round"/>

  <!-- Roof -->
  <polygon points="32,4 6,32 58,32"
     style="fill:url(#roofGrad);stroke:#0b1521;stroke-width:2;stroke-linejoin:round"/>

  <!-- Door -->
  <rect x="24" y="42" width="16" height="16"
     style="fill:#0b1521;fill-opacity:0.35;stroke:#0b1521;stroke-width:1.5;stroke-linejoin:round"/>

  <!-- Door knob -->
  <circle cx="37" cy="50" r="1.5"
     style="fill:#fce94f;stroke:none"/>
</svg>
